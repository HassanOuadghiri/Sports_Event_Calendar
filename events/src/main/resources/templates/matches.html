<table xmlns:th="http://www.w3.org/1999/xhtml">
    <!DOCTYPE html>
    <html xmlns:th="http://www.thymeleaf.org" lang="en">
    <head>
        <title>Matches</title>
    </head>
    <style>
        /* Global */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f8;
            margin: 20px;
            color: #333;
        }

        /* Table Container */
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #222;
        }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        /* Header */
        th {
            background-color: #4a90e2;
            color: white;
            text-align: left;
            padding: 12px 15px;
            font-weight: 600;
        }

        /* Cells */
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        /* Row hover effect */
        tr:hover {
            background-color: #f1f8ff;
            transition: background-color 0.3s;
        }

        /* Alternate row colors */
        tr:nth-child(even) {
            background-color: #f9fafb;
        }

        /* Responsive */
        @media (max-width: 768px) {
            table, thead, tbody, th, td, tr {
                display: block;
            }

            th {
                position: sticky;
                top: 0;
            }

            tr {
                margin-bottom: 15px;
            }

            td {
                text-align: right;
                padding-left: 50%;
                position: relative;
            }

            td::before {
                content: attr(data-label);
                position: absolute;
                left: 15px;
                width: 45%;
                font-weight: 600;
                text-align: left;
            }
        }
    </style>
    <body>

    <h2>Matches</h2>

    <table border="1">
        <tr>
            <th>Date</th>
            <th>Stage</th>
            <th>Home Team</th>
            <th>Away Team</th>
            <th>Score</th>
            <th>Winner</th>
            <th>Stadium</th>
        </tr>

        <tr th:each="match : ${matches}">
            <td th:text="${#temporals.format(match.dateVenue, 'dd MMM yyyy HH:mm')}"></td>
            <td th:text="${match.stage.name}"></td>

            <td th:text="${match.homeTeam.name}"></td>
            <td th:text="${match.awayTeam.name}"></td>

            <td>
                <span th:text="${match.result.homeGoals}"></span> -
                <span th:text="${match.result.awayGoals}"></span>
            </td>

            <td th:text="${match.result.winner}"></td>
            <td th:text="${match.stadium}"></td>
        </tr>

    </table>

    </body>
    </html>
